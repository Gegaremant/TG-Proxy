name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Стабильный debug-ключ: без него каждый прогон GitHub Actions генерирует
    # новый debug.keystore, подпись APK меняется и обновление поверх предыдущей
    # версии падает с INSTALL_FAILED_UPDATE_INCOMPATIBLE.
    - name: Restore stable debug keystore
      env:
        DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
      run: |
        if [ -z "$DEBUG_KEYSTORE_B64" ]; then
          echo "ERROR: secret ANDROID_DEBUG_KEYSTORE is not set" >&2
          exit 1
        fi
        mkdir -p ~/.android
        echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

    - name: Build with Gradle
      run: ./gradlew assembleDebug
      
    - name: Rename APK
      run: mv app/build/outputs/apk/debug/app-debug.apk TG-Proxy-1.2.3-Android.apk
      
    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.2.3
        name: "TG-Proxy-1.2.3"
        files: TG-Proxy-1.2.3-Android.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
